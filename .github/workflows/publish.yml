name: Publish

on:
  workflow_dispatch:
    inputs:
      packages:
        description: "'all', or one pnpm filter such as @wilsoon/auth-machine"
        type: string
        default: all
      dry_run:
        description: "Run every check and pack the tarballs, but publish nothing"
        type: boolean
        default: false

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

      - name: Show what would be published
        env:
          PACKAGES: ${{ inputs.packages }}
        run: |
          if [ "$PACKAGES" = "all" ]; then
            pnpm -r publish --dry-run --no-git-checks
          else
            pnpm --filter "$PACKAGES" publish --dry-run --no-git-checks
          fi

      - name: Publish
        if: ${{ !inputs.dry_run }}
        env:
          PACKAGES: ${{ inputs.packages }}
          # Empty when the repo has no NPM_TOKEN secret, which is the intended end state
          # once trusted publishing is confirmed working.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "$PACKAGES" = "all" ]; then
            pnpm -r publish --provenance --access public --no-git-checks
          else
            pnpm --filter "$PACKAGES" publish --provenance --access public --no-git-checks
          fi
