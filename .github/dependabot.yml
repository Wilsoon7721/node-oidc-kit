version: 2

updates:
  # Pinned SHAs don't update themselves, so without this the pins in ci.yml and
  # publish.yml quietly rot and stop receiving security fixes.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      # One PR for all action bumps rather than three.
      actions:
        patterns:
          - "*"
